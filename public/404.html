<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · Quanta Craft Launcher</title>
<style>
  :root{
    --ink:#0a0a0b; --ink-2:#45454d; --ink-3:#82828c;
    --line:#e7e7ea; --line-2:#d3d3d9;
    --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,Consolas,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh;
    display:grid; place-items:center;
    padding:32px;
    background:#fff; color:var(--ink);
    font-family:var(--sans); line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  .box{
    width:100%; max-width:560px;
    padding:40px 36px;
    background:#fff;
    border:1px solid var(--line-2);
    border-radius:10px;
    box-shadow:0 6px 0 0 var(--line);
  }
  .code{
    font-family:var(--mono);
    font-size:13px; font-weight:700; letter-spacing:.28em;
    color:var(--ink-3);
    text-transform:uppercase;
  }
  h1{ margin:14px 0 12px; font-size:clamp(24px,5vw,34px); font-weight:800; letter-spacing:-.015em }
  p{ margin:0 0 26px; color:var(--ink-2); font-size:15px }
  .face{
    display:inline-block; margin-left:6px;
    font-family:var(--mono); font-size:16px; color:var(--ink);
    animation:hop 2.6s cubic-bezier(.34,1.42,.48,1) infinite;
  }
  @keyframes hop{
    0%,72%,100%{ transform:translateY(0) rotate(0) }
    80%{ transform:translateY(-7px) rotate(-5deg) }
    88%{ transform:translateY(2px) rotate(2deg) }
    94%{ transform:translateY(-3px) rotate(0) }
  }
  a.btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:14px 26px;
    font-size:15px; font-weight:600;
    color:#fff; background:var(--ink);
    border:1px solid var(--ink); border-radius:5px;
    box-shadow:0 4px 0 0 #0a0a0b;
    text-decoration:none;
    transition:transform .14s ease, box-shadow .14s ease;
  }
  a.btn:hover{ transform:translateY(1px); box-shadow:0 3px 0 0 #0a0a0b }
  a.btn:active{ transform:translateY(4px); box-shadow:0 0 0 0 #0a0a0b }
  .links{ margin-top:22px; padding-top:20px; border-top:1px solid var(--line); font-size:13px; color:var(--ink-3) }
  .links a{ color:var(--ink-2); text-decoration:none; margin-right:18px; border-bottom:1px solid var(--line-2) }
  .links a:hover{ color:var(--ink); border-bottom-color:var(--ink) }
</style>
</head>
<body>
  <div class="box">
    <p class="code">Error 404</p>
    <h1>这里没有东西<span class="face">(｡ŏ_ŏ)</span></h1>
    <p>你要找的页面不存在，或者已经被移动了。本站只有一页，回首页就好。</p>
    <a class="btn" href="/">回到首页</a>
    <div class="links">
      <a href="https://github.com/ALLEN201123/Quanta-Craft-Launcher" target="_blank" rel="noopener">GitHub 仓库</a>
      <a href="https://github.com/ALLEN201123/Quanta-Craft-Launcher/releases/latest" target="_blank" rel="noopener">下载最新版</a>
    </div>
  </div>
</body>
</html>
